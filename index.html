<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V. Vade | DJ Mixes</title>
  <link href="https://cdn.jsdelivr.net/npm/computer-modern-web-font@1.0.1/fonts/Serif/cmun-serif.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f5f1e8;
      --text-color: #181715;
      --muted-color: #6a655d;
      --border-color: #d8d1c7;
      --card-color: rgba(255, 255, 255, 0.72);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Computer Modern Serif', serif;
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 5rem 1rem;
    }

    header {
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 4.75rem);
      line-height: 0.95;
      font-weight: 400;
    }

    header p {
      margin-top: 0.5rem;
      color: var(--muted-color);
      font-size: 1rem;
    }

    .mix-list {
      display: grid;
      gap: 1rem;
    }

    .mix-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border-color);
      background: var(--card-color);
    }

    .mix-number {
      color: var(--muted-color);
      font-size: 0.95rem;
    }

    .mix-title {
      font-size: 1.25rem;
      font-weight: 400;
    }

    .mix-link,
    .instagram-link {
      color: var(--text-color);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.1rem;
      white-space: nowrap;
    }

    .mix-link:hover,
    .instagram-link:hover {
      border-color: currentColor;
    }

    .connect {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
    }

    .connect span {
      color: var(--muted-color);
    }

    @media (max-width: 640px) {
      main {
        padding: 4rem 1rem;
      }

      .mix-card {
        grid-template-columns: 1fr;
        align-items: flex-start;
      }

      .connect {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>V. Vade</h1>
      <p>DJ mixes</p>
    </header>

    <section class="mix-list" aria-label="DJ mixes">
      <article class="mix-card">
        <p class="mix-number">01</p>
        <h2 class="mix-title">A Dialogue with Edit Select</h2>
        <a href="https://on.soundcloud.com/RpBjkdb7rloJNGCH0h" class="mix-link" target="_blank" rel="noreferrer">Play</a>
      </article>
      <article class="mix-card">
        <p class="mix-number">02</p>
        <h2 class="mix-title">SPOTCAST009 - v.vade</h2>
        <a href="https://on.soundcloud.com/GQCbQfAKXNt4wPTtrI" class="mix-link" target="_blank" rel="noreferrer">Play</a>
      </article>
      <article class="mix-card">
        <p class="mix-number">03</p>
        <h2 class="mix-title">V. Vade / 16-01-2026</h2>
        <a href="https://on.soundcloud.com/ykmK9OPoO0A9PxDZy6" class="mix-link" target="_blank" rel="noreferrer">Play</a>
      </article>
    </section>

    <section class="connect" aria-label="Instagram">
      <span>Instagram</span>
      <a href="https://www.instagram.com/_v.vade_/" class="instagram-link" target="_blank" rel="noreferrer">@_v.vade_</a>
    </section>
  </main>
</body>
</html>
